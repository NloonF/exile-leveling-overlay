[package]
name = "exile-leveling-overlay"
version = "0.1.0"
description = "Windows desktop shell for the Exile Leveling guide"
authors = ["Exile Leveling Overlay contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/NloonF/exile-leveling-overlay"

[lib]
name = "exile_leveling_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
