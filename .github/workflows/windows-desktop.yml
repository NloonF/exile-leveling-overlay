name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check application version
        run: npm run check:version

      - name: Test frontend integration
        run: npm test

      - name: Test native layer
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v6
        with:
          name: exile-leveling-overlay-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
